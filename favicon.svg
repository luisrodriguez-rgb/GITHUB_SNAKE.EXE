<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de Resplandor Neón Neumórfico -->
    <filter id="matrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laser-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="laserBlur" />
      <feMerge>
        <feMergeNode in="laserBlur" />
        <feMergeNode in="laserBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes Cibernéticos -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020905" />
      <stop offset="50%" stop-color="#051a0e" />
      <stop offset="100%" stop-color="#010503" />
    </linearGradient>

    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="snake-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <!-- Fondo Cyber Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#neon-stroke)" stroke-width="10" filter="url(#matrix-glow)" />

  <!-- Cuadrícula Matrix GitHub de Fondo -->
  <g opacity="0.35">
    <!-- Fila 1 -->
    <rect x="90" y="110" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="136" y="110" width="34" height="34" rx="7" fill="#087337" />
    <rect x="182" y="110" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="228" y="110" width="34" height="34" rx="7" fill="#0b1610" />
    <rect x="274" y="110" width="34" height="34" rx="7" fill="#087337" />
    <rect x="320" y="110" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="366" y="110" width="34" height="34" rx="7" fill="#06401f" />

    <!-- Fila 2 -->
    <rect x="90" y="156" width="34" height="34" rx="7" fill="#087337" />
    <rect x="136" y="156" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="182" y="156" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="228" y="156" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="274" y="156" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="320" y="156" width="34" height="34" rx="7" fill="#087337" />
    <rect x="366" y="156" width="34" height="34" rx="7" fill="#00ff66" />

    <!-- Fila 3 -->
    <rect x="90" y="202" width="34" height="34" rx="7" fill="#0b1610" />
    <rect x="136" y="202" width="34" height="34" rx="7" fill="#087337" />
    <rect x="182" y="202" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="228" y="202" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="274" y="202" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="320" y="202" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="366" y="202" width="34" height="34" rx="7" fill="#087337" />

    <!-- Fila 4 -->
    <rect x="90" y="248" width="34" height="34" rx="7" fill="#087337" />
    <rect x="136" y="248" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="182" y="248" width="34" height="34" rx="7" fill="#0b1610" />
    <rect x="228" y="248" width="34" height="34" rx="7" fill="#087337" />
    <rect x="274" y="248" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="320" y="248" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="366" y="248" width="34" height="34" rx="7" fill="#06401f" />

    <!-- Fila 5 -->
    <rect x="90" y="294" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="136" y="294" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="182" y="294" width="34" height="34" rx="7" fill="#087337" />
    <rect x="228" y="294" width="34" height="34" rx="7" fill="#0b1610" />
    <rect x="274" y="294" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="320" y="294" width="34" height="34" rx="7" fill="#087337" />
    <rect x="366" y="294" width="34" height="34" rx="7" fill="#00b84f" />

    <!-- Fila 6 -->
    <rect x="90" y="340" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="136" y="340" width="34" height="34" rx="7" fill="#087337" />
    <rect x="182" y="340" width="34" height="34" rx="7" fill="#00ff66" />
    <rect x="228" y="340" width="34" height="34" rx="7" fill="#00b84f" />
    <rect x="274" y="340" width="34" height="34" rx="7" fill="#087337" />
    <rect x="320" y="340" width="34" height="34" rx="7" fill="#06401f" />
    <rect x="366" y="340" width="34" height="34" rx="7" fill="#0b1610" />
  </g>

  <!-- Cuerpo de la Serpiente Cibernética -->
  <!-- Silueta exterior oscura -->
  <path d="M 120 370 L 120 220 Q 120 170 170 170 L 290 170 Q 340 170 340 220 L 340 290 Q 340 340 290 340 L 220 340 Q 170 340 170 290 L 170 270"
        fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trazo Neón Exterior -->
  <path d="M 120 370 L 120 220 Q 120 170 170 170 L 290 170 Q 340 170 340 220 L 340 290 Q 340 340 290 340 L 220 340 Q 170 340 170 290 L 170 270"
        fill="none" stroke="#00ff66" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#laser-glow)" />

  <!-- Columna Vertebral Láser Ultra Brillante -->
  <path d="M 120 370 L 120 220 Q 120 170 170 170 L 290 170 Q 340 170 340 220 L 340 290 Q 340 340 290 340 L 220 340 Q 170 340 170 290 L 170 270"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cabeza de la Serpiente -->
  <!-- Silueta cabeza -->
  <circle cx="170" cy="270" r="28" fill="#000000" />
  <!-- Cabeza blanca luminiscente -->
  <circle cx="170" cy="270" r="24" fill="#ffffff" filter="url(#laser-glow)" />

  <!-- Ojos Cibernéticos -->
  <circle cx="160" cy="260" r="6" fill="#020905" />
  <circle cx="180" cy="260" r="6" fill="#020905" />
  <circle cx="160" cy="258" r="2.8" fill="#00ff66" />
  <circle cx="180" cy="258" r="2.8" fill="#00ff66" />

  <!-- Partículas Cuánticas Alrededor de la Cabeza -->
  <circle cx="130" cy="250" r="4" fill="#00f2fe" filter="url(#laser-glow)" />
  <circle cx="210" cy="280" r="5" fill="#00ff66" filter="url(#laser-glow)" />
  <circle cx="165" cy="225" r="3.5" fill="#ffffff" filter="url(#laser-glow)" />
  <circle cx="340" cy="380" r="6" fill="#00ff66" opacity="0.8" />
  <circle cx="370" cy="140" r="5" fill="#00f2fe" opacity="0.9" />

  <!-- Marca de Esquina Terminal -->
  <g fill="#00ff66" opacity="0.6">
    <rect x="52" y="52" width="20" height="4" rx="2" />
    <rect x="52" y="52" width="4" height="20" rx="2" />
    <rect x="440" y="440" width="20" height="4" rx="2" />
    <rect x="456" y="424" width="4" height="20" rx="2" />
  </g>
</svg>

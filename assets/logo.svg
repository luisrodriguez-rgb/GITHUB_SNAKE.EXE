<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="matrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laser-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="laserBlur" />
      <feMerge>
        <feMergeNode in="laserBlur" />
        <feMergeNode in="laserBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d06" />
      <stop offset="50%" stop-color="#052613" />
      <stop offset="100%" stop-color="#010603" />
    </linearGradient>

    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
  </defs>

  <!-- Fondo Escudo Cyber -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg-grad)" stroke="url(#neon-border)" stroke-width="16" filter="url(#matrix-glow)" />

  <!-- Cuadrícula Matrix Ampliada -->
  <g opacity="0.45">
    <!-- Fila 1 -->
    <rect x="65" y="75" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="130" y="75" width="52" height="52" rx="10" fill="#087337" />
    <rect x="195" y="75" width="52" height="52" rx="10" fill="#00b84f" />
    <rect x="260" y="75" width="52" height="52" rx="10" fill="#087337" />
    <rect x="325" y="75" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="390" y="75" width="52" height="52" rx="10" fill="#06401f" />

    <!-- Fila 2 -->
    <rect x="65" y="140" width="52" height="52" rx="10" fill="#087337" />
    <rect x="130" y="140" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="195" y="140" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="260" y="140" width="52" height="52" rx="10" fill="#00b84f" />
    <rect x="325" y="140" width="52" height="52" rx="10" fill="#087337" />
    <rect x="390" y="140" width="52" height="52" rx="10" fill="#00ff66" />

    <!-- Fila 3 -->
    <rect x="65" y="205" width="52" height="52" rx="10" fill="#0b1610" />
    <rect x="130" y="205" width="52" height="52" rx="10" fill="#087337" />
    <rect x="195" y="205" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="260" y="205" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="325" y="205" width="52" height="52" rx="10" fill="#00b84f" />
    <rect x="390" y="205" width="52" height="52" rx="10" fill="#087337" />

    <!-- Fila 4 -->
    <rect x="65" y="270" width="52" height="52" rx="10" fill="#087337" />
    <rect x="130" y="270" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="195" y="270" width="52" height="52" rx="10" fill="#087337" />
    <rect x="260" y="270" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="325" y="270" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="390" y="270" width="52" height="52" rx="10" fill="#00b84f" />

    <!-- Fila 5 -->
    <rect x="65" y="335" width="52" height="52" rx="10" fill="#00b84f" />
    <rect x="130" y="335" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="195" y="335" width="52" height="52" rx="10" fill="#087337" />
    <rect x="260" y="335" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="325" y="335" width="52" height="52" rx="10" fill="#087337" />
    <rect x="390" y="335" width="52" height="52" rx="10" fill="#00ff66" />

    <!-- Fila 6 -->
    <rect x="65" y="400" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="130" y="400" width="52" height="52" rx="10" fill="#087337" />
    <rect x="195" y="400" width="52" height="52" rx="10" fill="#00ff66" />
    <rect x="260" y="400" width="52" height="52" rx="10" fill="#00b84f" />
    <rect x="325" y="400" width="52" height="52" rx="10" fill="#06401f" />
    <rect x="390" y="400" width="52" height="52" rx="10" fill="#0b1610" />
  </g>

  <!-- Silueta Grande y Gruesa de la Serpiente -->
  <!-- 1. Borde Exterior Negro de Alto Impacto -->
  <path d="M 100 420 L 100 230 Q 100 160 170 160 L 320 160 Q 390 160 390 230 L 390 310 Q 390 380 320 380 L 220 380 Q 160 380 160 310 L 160 270"
        fill="none" stroke="#000000" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. Cuerpo Verde Neón Brillante -->
  <path d="M 100 420 L 100 230 Q 100 160 170 160 L 320 160 Q 390 160 390 230 L 390 310 Q 390 380 320 380 L 220 380 Q 160 380 160 310 L 160 270"
        fill="none" stroke="#00ff66" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#laser-glow)" />

  <!-- 3. Columna Vertebral Láser Blanca Ultra Visible -->
  <path d="M 100 420 L 100 230 Q 100 160 170 160 L 320 160 Q 390 160 390 230 L 390 310 Q 390 380 320 380 L 220 380 Q 160 380 160 310 L 160 270"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cabeza Grande de la Serpiente -->
  <!-- Contorno negro cabeza -->
  <circle cx="160" cy="270" r="38" fill="#000000" />
  <!-- Cabeza blanca -->
  <circle cx="160" cy="270" r="30" fill="#ffffff" filter="url(#laser-glow)" />

  <!-- Ojos Grandes Cibernéticos -->
  <circle cx="146" cy="258" r="8.5" fill="#020905" />
  <circle cx="174" cy="258" r="8.5" fill="#020905" />
  <circle cx="146" cy="256" r="4.2" fill="#00ff66" />
  <circle cx="174" cy="256" r="4.2" fill="#00ff66" />

  <!-- Partículas Cuánticas Ampliadas -->
  <circle cx="215" cy="250" r="7" fill="#00f2fe" filter="url(#laser-glow)" />
  <circle cx="115" cy="285" r="8" fill="#00ff66" filter="url(#laser-glow)" />
  <circle cx="390" cy="385" r="9" fill="#00ff66" filter="url(#laser-glow)" />
  <circle cx="330" cy="115" r="8" fill="#ffffff" filter="url(#laser-glow)" />
</svg>
